name: Build GaodeClean

# 正式发布包一律由本工作流构建（theos，双架构）。
#   分支 push → 只出包 + 校验（产物在 artifact）
#   打 v* tag → 额外把 deb×2 / dylib×2 / Source.zip / SHA256SUMS 发到 Release
# 说明：本机 iSH 的 clang 链（Makefile.local）仅供临时验证，不作为发布来源。
#
# ★0.9.123（A5）：runner 从 macos-14 迁到 ubuntu-latest。
#   起因：2026-11-06 00:09 起，本仓库的 macos-14 job 在 1~3 秒内被取消，
#   runner_id=0、runner_name 为空 —— 说明 job 根本没分配到 runner 就被取消，
#   与代码无关（同一时间同账号另一仓库的 ubuntu-latest 正常跑完）。
#   已在半小时内重试 push / 空提交 / workflow_dispatch 共 4 次，全部一样。
#   公共仓库的 Linux runner 最稳，且 theos 在 Linux 上是官方一等支持，
#   产出与 macOS 完全一致（同一份 clang + 同一份 iPhoneOS SDK + 同一套 ldid 签名）。
#   macOS 专属的 brew / otool 分支全部换掉；verify_deb.sh 里已有的
#   llvm-objdump / python plistlib 回退正好在 Linux 上生效。

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'dist/**'
      - '**/*.md'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      probe:
        description: '出探针包（-DGAODECLEAN_PROBE=1）'
        type: boolean
        default: false
      version:
        description: '覆盖版本号，如 0.9.99+probe43（留空则用 control 里的）'
        required: false
        default: ''

permissions:
  contents: write

env:
  THEOS_COMMIT: cfba89a53a05b4a1b822121158acc3669c20602f
  SDKS_COMMIT: 0222fd5413cf4b9af096f37b4621afa2688572f7

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build prerequisites (Linux)
        run: |
          set -e
          sudo apt-get update
          # theos 官方 Linux 依赖（build-essential/fakeroot/rsync/perl/libxml2 等）
          # + dpkg/xz（打包）+ zip（源码包）+ clang/llvm（混淆自测 + objdump 验链式绑定）
          #
          # ★0.9.123（A5'）：不装 libtinfo5 / libncurses5 / ldid —— 实测 runner 是
          #   Ubuntu 26.04（resolute），这三个包在官方源里都不存在：
          #     libtinfo5/libncurses5：只有 Swift 工具链才需要，我们用的是非 Swift 版
          #     ldid：theos 仓库自带 Linux 二进制（$THEOS/bin/ldid），不需要 apt
          #   第一次跑就是因为这三个包导致 `E: Unable to locate package` + exit 100。
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl git zip xz-utils \
            libxml2-dev dpkg clang llvm
          # fakeroot 用 sysv 后端（官方建议，避免部分发行版的 tcp 限制）
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv || true
          echo "--- 工具自检 ---"
          for t in make clang dpkg-deb zip rsync fakeroot llvm-objdump; do
            printf '%-14s ' "$t"; command -v $t || echo '(缺)'
          done

      - name: Install ldid (Linux static binary)
        run: |
          set -e
          # theos 的打包链要 PATH 里有 ldid（makefiles/targets/_common/darwin_head.mk
          # 用 `__executable,ldid` 探测），而 Ubuntu 26.04 官方源没有这个包。
          # 用 ProcursusTeam/ldid 官方发行的 Linux 静态二进制，放 /usr/local/bin。
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  L=ldid_linux_x86_64 ;;
            aarch64) L=ldid_linux_aarch64 ;;
            *) echo "不支持的架构 $ARCH"; exit 1 ;;
          esac
          # ★0.9.130（A17）：优先用**仓库内自带的 ldid**。
          #   起因：2026-11-08 GitHub Releases 的 asset CDN 大面积 504，
          #   同一份代码的 roothide job 成功、rootless job 失败（纯概率），发版被卡死。
          #   ldid 是 2.9MB 的静态二进制，直接入仓最稳，且版本固定、可复现。
          #   三级回退：仓库内 → API asset 端点 → Releases 直链。
          if [ -x "tools/ldid/${L}" ]; then
            echo "ldid: 用仓库内自带副本 tools/ldid/${L}"
            sudo cp "tools/ldid/${L}" /usr/local/bin/ldid
            OK2=1
          else
            OK2=0
            API_ID=""
            [ "$ARCH" = "x86_64" ] && API_ID="92097311" || API_ID="92097309"
            URL_LDID="https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/${L}"
            for try in 1 2 3 4 5; do
              # ① 先试 API asset 端点（走 api.github.com，绕开 objects.githubusercontent.com）
              if [ -n "$API_ID" ] && sudo curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
                   -H "Accept: application/octet-stream" --max-time 120 \
                   -o /usr/local/bin/ldid \
                   "https://api.github.com/repos/ProcursusTeam/ldid/releases/assets/${API_ID}"; then
                OK2=1; break
              fi
              # ② 再试 Releases 直链
              if sudo curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors \
                   --connect-timeout 20 --max-time 300 \
                   -o /usr/local/bin/ldid "$URL_LDID"; then
                OK2=1; break
              fi
              echo "ldid 尝试 $try 失败，重试…"
              sleep $((try * 8))
            done
          fi
          [ "$OK2" = "1" ] || { echo "ldid 下载 5 次均失败"; exit 1; }
          sudo chmod +x /usr/local/bin/ldid
          ldid -h 2>&1 | head -3 || true
          echo "ldid → $(command -v ldid)"

      - name: Install theos (roothide fork, pinned) + SDK
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/roothide/theos.git $THEOS
          if [ "$(git -C $THEOS rev-parse HEAD)" != "$THEOS_COMMIT" ]; then
            git -C $THEOS fetch --depth 1 origin "$THEOS_COMMIT"
            git -C $THEOS checkout --detach FETCH_HEAD
            git -C $THEOS submodule update --init --recursive --depth 1
          fi
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          if [ "$(git -C $THEOS/sdks rev-parse HEAD)" != "$SDKS_COMMIT" ]; then
            git -C $THEOS/sdks fetch --depth 1 origin "$SDKS_COMMIT"
            git -C $THEOS/sdks checkout --detach FETCH_HEAD
          fi
          # ★Linux 专属：装 theos 的 iOS 工具链（macOS 上是 Xcode 自带，Linux 需要下载）
          #   用 L1ghtmann/llvm-project 的预编译包，与 theos 官方安装器同一个来源。
          if [ ! -d "$THEOS/toolchain/linux/iphone" ] || [ -z "$(ls -A "$THEOS/toolchain/linux/iphone" 2>/dev/null)" ]; then
            mkdir -p "$THEOS/toolchain"
            ARCH=$(uname -m)   # x86_64 / aarch64
            if [ "$ARCH" = "x86_64" ]; then
              TC_URL="https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz"
            else
              TC_URL="https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-${ARCH}.tar.xz"
            fi
            echo "toolchain: $TC_URL"
            # ★0.9.129（A13）：下载加**重试 + 完整性校验**。
            #   起因：2026-11-08 连续两次 CI 挂在这一行 ——
            #     第一次 `xz: (stdin): File format not recognized`（拿到了非 xz 内容）
            #     第二次 `curl: (22) The requested URL returned error: 504`
            #   都是 GitHub releases 的临时故障，与代码无关，但会把发版卡死。
            #   `curl | tar` 管道还有个隐患：curl 失败时 tar 仍会读空流，错误信息看不出根因。
            #   改为：先下到文件 → 校验 xz 头 → 再解包；失败重试 3 次（间隔递增）。
            TC_FILE="/tmp/ios-toolchain.tar.xz"
            # ★0.9.130（A17'）：与 ldid 同一策略 —— 优先走 **api.github.com 的 asset 端点**。
            #   起因：2026-11-08 GitHub Releases 的 objects.githubusercontent.com 大面积 504，
            #   而 api.github.com 正常。工具链 ~86MB 不适合入仓，所以走 API 下载。
            if [ "$ARCH" = "x86_64" ]; then TC_ASSET=124862108; else TC_ASSET=124872377; fi
            OK=0
            for try in 1 2 3 4 5; do
              rm -f "$TC_FILE"
              # ① API asset 端点（绕开 objects CDN）
              if curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
                      -H "Accept: application/octet-stream" \
                      --connect-timeout 20 --max-time 900 \
                      -o "$TC_FILE" \
                      "https://api.github.com/repos/L1ghtmann/llvm-project/releases/assets/${TC_ASSET}"; then
                if [ "$(head -c 6 "$TC_FILE" | od -An -tx1 | tr -d ' \n')" = "fd377a585a00" ]; then
                  OK=1; break
                fi
                echo "尝试 $try：API 端点内容不是 xz，回退直链"
              fi
              # ② Releases 直链
              if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
                      --connect-timeout 20 --max-time 900 \
                      -o "$TC_FILE" "$TC_URL"; then
                # xz 魔数：fd 37 7a 58 5a 00
                if [ "$(head -c 6 "$TC_FILE" | od -An -tx1 | tr -d ' \n')" = "fd377a585a00" ]; then
                  OK=1; break
                fi
                echo "尝试 $try：内容不是 xz（前 32 字节：$(head -c 32 "$TC_FILE" | tr -d '\0'))"
              else
                echo "尝试 $try：curl 失败（exit $?）"
              fi
              sleep $((try * 10))
            done
            [ "$OK" = "1" ] || { echo "工具链下载 5 次均失败，放弃"; exit 1; }
            ls -la "$TC_FILE"
            tar -xJf "$TC_FILE" -C "$THEOS/toolchain/"
            rm -f "$TC_FILE"
          fi
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "--- theos 自检 ---"
          ls -d $THEOS/sdks/iPhoneOS*.sdk 2>/dev/null | head
          ls -d $THEOS/toolchain/linux/iphone 2>/dev/null || true

      - name: Apply version override (dispatch)
        if: ${{ inputs.version != '' }}
        run: |
          set -e
          echo "override → ${{ inputs.version }}"
          sed -i.bak "s/^Version:.*/Version: ${{ inputs.version }}/" control
          sed -i.bak "s/kGCVersion     = @\"[^\"]*\"/kGCVersion     = @\"${{ inputs.version }}\"/" src/GaodeClean.m
          grep -E '^(Version|Architecture):' control
          grep -o 'kGCVersion     = @"[^"]*"' src/GaodeClean.m

      - name: Build (${{ matrix.scheme }})
        run: |
          set -e
          export THEOS=$HOME/theos
          make clean >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} GC_PROBE=${{ inputs.probe && '1' || '0' }}
          mkdir -p out
          find packages -name '*.deb' -exec cp {} out/ \;
          ls -l out/

      - name: Obfuscation round-trip self-test (${{ matrix.scheme }})
        run: |
          set -e
          # 明文清单（scripts/obf_strings.txt）自 0.9.98 起不再入库（仓库转公开，
          # 该文件含高德内部类名/页面路径，等同反编译成果）。文件不在时跳过本步；
          # 本机仍保留该文件，make check 会跑完整回环（295/295 + FNV）。
          if [ ! -f scripts/obf_strings.txt ]; then
            echo "::notice::scripts/obf_strings.txt 不在仓库中（公开仓库不携带明文清单），跳过混淆回环自测"
            exit 0
          fi
          # 用与运行时完全同一份解码数学（src/GCObfMath.h）在 CI 上把全部混淆串
          # 解回明文，逐条与 scripts/obf_strings.txt 比对并校验头内 FNV 摘要。
          clang -O2 -Wall -Wextra -I src -o /tmp/obf_selftest scripts/obf_selftest.c
          /tmp/obf_selftest scripts/obf_strings.txt

      - name: Inspect payload (${{ matrix.scheme }})
        run: |
          set -e
          for d in out/*.deb; do
            echo "== $d"
            dpkg-deb -f "$d" Package Version Architecture Depends Installed-Size
            echo "--- 载荷 ---"
            dpkg-deb -c "$d"
          done

      - name: Verify payload (${{ matrix.scheme }})
        run: |
          set -e
          chmod +x scripts/verify_deb.sh
          for d in out/*.deb; do
            scripts/verify_deb.sh "$d" "${{ matrix.scheme }}"
          done

      - name: Collect dylib
        run: |
          set -e
          rm -rf /tmp/x && mkdir -p /tmp/x
          D=$(ls out/*.deb | head -1)
          dpkg-deb -x "$D" /tmp/x
          DYL=$(find /tmp/x -name GaodeClean.dylib)
          VER=$(dpkg-deb -f "$D" Version)
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            cp "$DYL" "out/GaodeClean-${VER}-arm64.dylib"
          else
            cp "$DYL" "out/GaodeClean-${VER}-arm64e.dylib"
          fi
          ls -l out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GaodeClean-${{ matrix.scheme }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build clean source zip (no dist/, no build outputs)
        run: |
          set -e
          VER=$(grep -m1 '^Version:' control | awk '{print $2}')
          git archive HEAD --prefix=GaodeClean-${VER}/ | tar -x
          rm -rf GaodeClean-${VER}/dist GaodeClean-${VER}/packages GaodeClean-${VER}/.theos
          # 0.9.20：混淆明文清单留在私有仓库，刻意不随源码包分发
          rm -f GaodeClean-${VER}/scripts/obf_strings.txt
          zip -qr "artifacts/GaodeClean-${VER}-Source.zip" "GaodeClean-${VER}"
          rm -rf "GaodeClean-${VER}"
          ls -l artifacts/

      - name: SHA256SUMS
        run: |
          set -e
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: false
          body: |
            > 高德地图界面精简 · 纯运行时 hook · 不抓网络、不改 IPA

            ## 装哪个

            | 你的越狱环境 | 下载 |
            | --- | --- |
            | **rootless / Dopamine / palera1n** | `*_iphoneos-arm64.deb` |
            | **RootHide（隐根）** | `*_iphoneos-arm64e.deb` |

            两个架构**不要同时装**。装完注销（`sbreload`）或重启用户空间，再打开高德。
            也可以直接从软件源装：`https://gan-jibamao.github.io/`

            ## 功能

            - **去广告**：开屏广告、顶部运营横幅、顶部运营通知条（按结构判定，不看文案）
            - **去干扰**：底栏上滑白雾/闪白、顶部模糊带、首页白块、底栏「上拉发现」引导
            - **修布局**：定位/路线胶囊、连接车机、搜索栏、天气行按原生关系归位；
              切页不闪、冷启动不在屏幕中部裸奔
            - **深色模式**：底栏圆钮/胶囊/搜索钮跟随系统压深，「我的」页白底一并处理
            - **全版本自适应**：按类名与几何特征判定，不绑定 App 版本号

            ## 更新内容

            本版变更见 [`HISTORY.md`](https://github.com/gan-jibamao/GaodeClean/blob/main/HISTORY.md)
            最新章节（含根因分析与验证记录）。

            ## 校验

            安装前请核对本页的 `SHA256SUMS.txt`。附件中的 `Source.zip` 是 `git archive`
            生成的干净快照，不含 `dist/`、`packages/`、`.theos/` 等构建产物。

            ## 构建

            由 GitHub Actions 构建：`ubuntu-latest` + roothide theos（commit 固定）
            + iPhoneOS SDK（commit 固定），`FINALPACKAGE=1` 双架构各出一包，
            并跑 `scripts/verify_deb.sh` 门禁（载荷路径 / 架构切片 / 依赖 /
            过滤器 / 版本串一致性 / arm64e 链式绑定 / 日志与探针零残留）。