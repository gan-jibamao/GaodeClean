name: Build 0.3.x

# GaodeClean 0.3.x 专属构建（与 main 的 0.9.x 工作流完全隔离）
# macOS-14 + theos + 官方工具链（Apple ld64）
# 目的：arm64 / arm64e 双架构都产出链式绑定（LC_DYLD_CHAINED_FIXUPS）。
# 本机 iSH 的 ld64.lld 19.1.4 不支持 arm64e 的 -fixup_chains，
# 只能出经典绑定，装到 arm64e 设备上会被 dyld 拒绝。

on:
  push:
    branches: [ 'gc03/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install theos and SDK
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/roothide/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          brew install ldid dpkg 2>/dev/null || true
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "--- SDK ---"
          ls $THEOS/sdks | head

      - name: Show target
        run: |
          echo "Version: $(grep -m1 '^Version:' control | awk '{print $2}')"
          echo "--- 版本锁状态（应为已删）---"
          grep -c 'unsupported app version' src/GaodeClean.m || true

      - name: Build rootless arm64
        run: |
          set -e
          export THEOS=$HOME/theos
          make clean >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64 2>&1 | tail -40
          mkdir -p out
          find packages -name '*arm64.deb' -exec cp {} out/ \; 2>/dev/null || true
          ls -l out/ || true

      - name: Build roothide arm64e
        run: |
          set -e
          export THEOS=$HOME/theos
          make clean >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e 2>&1 | tail -40
          find packages -name '*arm64e.deb' -exec cp {} out/ \; 2>/dev/null || true
          ls -l out/ || true

      - name: Inspect payload
        run: |
          set -e
          for d in out/*.deb; do
            echo "== $d"
            dpkg-deb -f "$d" Package Version Architecture
            dpkg-deb -c "$d"
          done

      - name: Verify chained fixups
        run: |
          set -e
          for d in out/*.deb; do
            echo "===== $d"
            rm -rf /tmp/vx && mkdir -p /tmp/vx
            dpkg-deb -x "$d" /tmp/vx
            DYL=$(find /tmp/vx -name GaodeClean.dylib | head -1)
            echo "dylib: $DYL ($(stat -f%z "$DYL") B)"
            python3 scripts/verify_chained.py "$DYL"
            echo "--- 版本串 ---"
            strings -a "$DYL" | grep -E 'no version limit|unsupported app version' || true
            echo "--- 过滤器 ---"
            cat "$(dirname "$DYL")/GaodeClean.plist" | tr -d ' \n' | grep -o 'com.autonavi.amap' || true
          done

      - name: Collect dylib
        run: |
          set -e
          VER=$(grep -m1 '^Version:' control | awk '{print $2}')
          for d in out/*.deb; do
            rm -rf /tmp/vy && mkdir -p /tmp/vy
            dpkg-deb -x "$d" /tmp/vy
            DYL=$(find /tmp/vy -name GaodeClean.dylib | head -1)
            case "$d" in
              *arm64e*) cp "$DYL" "out/GaodeClean-${VER}-arm64e.dylib" ;;
              *)        cp "$DYL" "out/GaodeClean-${VER}-arm64.dylib" ;;
            esac
          done
          ls -l out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GaodeClean-0.3.x
          path: out/*
          if-no-files-found: error
